<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<title>Mi mañana de escuela / My school morning</title>
<g fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="70" width="360" height="245" rx="18"/>
<rect x="44" y="84" width="48" height="48" rx="8"/>
<g transform="translate(210 175)"><path d="M -100 10 C -100 70, -10 70, -10 10 Z"/><path d="M -110 10 L 0 10"/><path d="M -30 -40 L -60 5"/><rect x="25" y="-20" width="50" height="70" rx="6"/><path d="M 75 0 C 100 0, 100 30, 75 30"/><path d="M -80 -20 C -60 -60, -20 -60, 0 -40 C -30 -45, -55 -40, -80 -20 Z"/></g>
<rect x="410" y="70" width="360" height="245" rx="18"/>
<rect x="424" y="84" width="48" height="48" rx="8"/>
<g transform="translate(590 175)"><rect x="-120" y="10" width="150" height="45" rx="8"/><rect x="-115" y="-12" width="50" height="24" rx="10"/><circle cx="85" cy="-15" r="45"/><path d="M 85 -15 L 85 -48"/><path d="M 85 -15 L 85 20"/><path d="M 55 -55 L 45 -68"/><path d="M 115 -55 L 125 -68"/></g>
<rect x="30" y="335" width="360" height="245" rx="18"/>
<rect x="44" y="349" width="48" height="48" rx="8"/>
<g transform="translate(210 440)"><rect x="-55" y="-60" width="110" height="130" rx="30"/><rect x="-35" y="10" width="70" height="45" rx="10"/><path d="M -25 -60 C -25 -95, 25 -95, 25 -60"/><path d="M -35 30 L 35 30"/></g>
<rect x="410" y="335" width="360" height="245" rx="18"/>
<rect x="424" y="349" width="48" height="48" rx="8"/>
<g transform="translate(590 440)"><path d="M -40 -65 L -95 -35 L -75 0 L -55 -12 L -55 70 L 55 70 L 55 -12 L 75 0 L 95 -35 L 40 -65 C 25 -40, -25 -40, -40 -65 Z"/><path d="M 0 -45 L 0 70"/><circle cx="12" cy="-10" r="4"/><circle cx="12" cy="20" r="4"/><circle cx="12" cy="50" r="4"/></g>
</g>
<text x="400" y="45" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">¿Qué va primero? Escribe 1, 2, 3, 4 / What comes first? Write 1, 2, 3, 4</text>
<text x="210" y="277" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Desayuno</text>
<text x="210" y="301" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">I have breakfast</text>
<text x="590" y="277" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Me despierto a las 6:30</text>
<text x="590" y="301" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">I wake up at 6:30</text>
<text x="210" y="542" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Llevo mi mochila</text>
<text x="210" y="566" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">I take my backpack</text>
<text x="590" y="542" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Me pongo el uniforme</text>
<text x="590" y="566" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">I put on my uniform</text>
</svg>
