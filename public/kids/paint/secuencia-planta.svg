<text x="400" y="45" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">¿Qué va primero? Escribe 1, 2, 3, 4 / What comes first? Write 1, 2, 3, 4</text>
<text x="210" y="277" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Sale un brote</text>
<text x="210" y="301" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">A sprout comes out</text>
<text x="590" y="277" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Crece una flor</text>
<text x="590" y="301" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">A flower grows</text>
<text x="210" y="542" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Pongo la semilla</text>
<text x="210" y="566" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">I plant the seed</text>
<text x="590" y="542" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Riego con agua</text>
<text x="590" y="566" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">I water it</text>
</svg>
