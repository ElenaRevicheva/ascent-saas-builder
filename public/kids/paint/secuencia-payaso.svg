<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<title>El payaso se prepara / The clown gets ready</title>
<g fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="70" width="360" height="245" rx="18"/>
<rect x="44" y="84" width="48" height="48" rx="8"/>
