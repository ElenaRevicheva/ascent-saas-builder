<text x="400" y="45" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">¿Qué va primero? Escribe 1, 2, 3, 4 / What comes first? Write 1, 2, 3, 4</text>
<text x="210" y="277" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">La crisálida</text>
<text x="210" y="301" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">The chrysalis</text>
<text x="590" y="277" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Los huevos en la hoja</text>
<text x="590" y="301" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Eggs on a leaf</text>
<text x="210" y="542" font-family="Comic Sans MS, Chalkboard SE, Nunito, Trebuchet MS, sans-serif" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">La mariposa</text>
